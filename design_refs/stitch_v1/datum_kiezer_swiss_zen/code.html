<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #f5f6f7;
            color: #2c2f30;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface antialiased min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#f5f6f7]/80 backdrop-blur-xl flex items-center justify-between px-6 h-16 w-full shadow-[0_12px_40px_rgba(12,15,16,0.04)]">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-[#dadddf]/50 transition-colors active:scale-95 duration-200 ease-out text-[#6d5a00]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold text-lg tracking-tight text-[#6d5a00]">Datum Kiezer</h1>
</div>
<div class="w-10"></div>
</header>
<main class="pt-24 pb-32 px-6 max-w-xl mx-auto min-h-screen">
<!-- Date Input Fields -->
<div class="grid grid-cols-2 gap-4 mb-10">
<div class="flex flex-col gap-2">
<label class="font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant px-2">Van</label>
<div class="relative group">
<input class="w-full bg-surface-container-low border-none rounded-md px-4 py-4 font-body text-sm focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container transition-all outline-none cursor-pointer" readonly="" type="text" value="12 Oct 2023"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant px-2">Tot</label>
<div class="relative group">
<input class="w-full bg-surface-container-low border-none rounded-md px-4 py-4 font-body text-sm focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container transition-all outline-none cursor-pointer border-2 border-primary-container/40" readonly="" type="text" value="24 Oct 2023"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-primary text-sm" data-icon="calendar_today">calendar_today</span>
</div>
</div>
</div>
<!-- Calendar Container -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_12px_40px_rgba(12,15,16,0.04)]">
<!-- Calendar Header -->
<div class="flex items-center justify-between mb-8">
<h2 class="font-headline font-extrabold text-2xl tracking-tight">Oktober 2023</h2>
<div class="flex gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</div>
<!-- Calendar Grid -->
<div class="grid grid-cols-7 gap-y-2 text-center">
<!-- Days labels -->
<div class="font-label text-[10px] font-extrabold text-on-surface-variant uppercase mb-4">Ma</div>
<div class="font-label text-[10px] font-extrabold text-on-surface-variant uppercase mb-4">Di</div>
<div class="font-label text-[10px] font-extrabold text-on-surface-variant uppercase mb-4">Wo</div>
<div class="font-label text-[10px] font-extrabold text-on-surface-variant uppercase mb-4">Do</div>
<div class="font-label text-[10px] font-extrabold text-on-surface-variant uppercase mb-4">Vr</div>
<div class="font-label text-[10px] font-extrabold text-on-surface-variant uppercase mb-4">Za</div>
<div class="font-label text-[10px] font-extrabold text-on-surface-variant uppercase mb-4 text-error">Zo</div>
<!-- Empty spaces for previous month -->
<div class="h-12 flex items-center justify-center text-outline-variant/30 font-body text-sm">25</div>
<div class="h-12 flex items-center justify-center text-outline-variant/30 font-body text-sm">26</div>
<div class="h-12 flex items-center justify-center text-outline-variant/30 font-body text-sm">27</div>
<div class="h-12 flex items-center justify-center text-outline-variant/30 font-body text-sm">28</div>
<div class="h-12 flex items-center justify-center text-outline-variant/30 font-body text-sm">29</div>
<div class="h-12 flex items-center justify-center text-outline-variant/30 font-body text-sm">30</div>
<div class="h-12 flex items-center justify-center font-body text-sm">1</div>
<!-- Actual Month -->
<div class="h-12 flex items-center justify-center font-body text-sm">2</div>
<div class="h-12 flex items-center justify-center font-body text-sm">3</div>
<div class="h-12 flex items-center justify-center font-body text-sm">4</div>
<div class="h-12 flex items-center justify-center font-body text-sm">5</div>
<div class="h-12 flex items-center justify-center font-body text-sm">6</div>
<div class="h-12 flex items-center justify-center font-body text-sm">7</div>
<div class="h-12 flex items-center justify-center font-body text-sm">8</div>
<div class="h-12 flex items-center justify-center font-body text-sm">9</div>
<div class="h-12 flex items-center justify-center font-body text-sm">10</div>
<div class="h-12 flex items-center justify-center font-body text-sm">11</div>

<div class="relative h-12 flex items-center justify-center">
<div class="absolute inset-y-0 right-0 left-1/2 bg-primary-container/30"></div>
<div class="relative z-10 w-10 h-10 flex items-center justify-center bg-primary text-on-primary rounded-full font-bold text-sm shadow-md">12</div>
</div>
<!-- Selection Range -->
<div class="h-12 flex items-center justify-center bg-primary-container/30 font-body text-sm">13</div>
<div class="h-12 flex items-center justify-center bg-primary-container/30 font-body text-sm">14</div>
<div class="h-12 flex items-center justify-center bg-primary-container/30 font-body text-sm">15</div>
<div class="h-12 flex items-center justify-center bg-primary-container/30 font-body text-sm">16</div>
<div class="h-12 flex items-center justify-center bg-primary-container/30 font-body text-sm">17</div>
<div class="h-12 flex items-center justify-center bg-primary-container/30 font-body text-sm">18</div>
<div class="h-12 flex items-center justify-center bg-primary-container/30 font-body text-sm">19</div>
<div class="h-12 flex items-center justify-center bg-primary-container/30 font-body text-sm">20</div>
<div class="h-12 flex items-center justify-center bg-primary-container/30 font-body text-sm">21</div>
<div class="h-12 flex items-center justify-center bg-primary-container/30 font-body text-sm">22</div>
<div class="h-12 flex items-center justify-center bg-primary-container/30 font-body text-sm">23</div>

<div class="absolute inset-y-0 left-0 right-1/2 bg-primary-container/30"></div>
<div class="relative z-10 w-10 h-10 flex items-center justify-center bg-primary text-on-primary rounded-full font-bold text-sm shadow-md">24</div>
</div>
<div class="h-12 flex items-center justify-center font-body text-sm">25</div>
<div class="h-12 flex items-center justify-center font-body text-sm">26</div>
<div class="h-12 flex items-center justify-center font-body text-sm">27</div>
<div class="h-12 flex items-center justify-center font-body text-sm">28</div>
<div class="h-12 flex items-center justify-center font-body text-sm">29</div>
<div class="h-12 flex items-center justify-center font-body text-sm">30</div>
<div class="h-12 flex items-center justify-center font-body text-sm">31</div>
<div class="h-12 flex items-center justify-center text-outline-variant/30 font-body text-sm">1</div>
<div class="h-12 flex items-center justify-center text-outline-variant/30 font-body text-sm">2</div>
<div class="h-12 flex items-center justify-center text-outline-variant/30 font-body text-sm">3</div>
<div class="h-12 flex items-center justify-center text-outline-variant/30 font-body text-sm">4</div>
<div class="h-12 flex items-center justify-center text-outline-variant/30 font-body text-sm">5</div>
</div>
</div>
<!-- Suggestions -->
<div class="mt-10 flex flex-wrap gap-3">
<button class="px-5 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-label text-xs font-bold uppercase tracking-wider hover:bg-surface-container-highest transition-colors">Laatste 7 dagen</button>
<button class="px-5 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-label text-xs font-bold uppercase tracking-wider hover:bg-surface-container-highest transition-colors">Laatste 30 dagen</button>
<button class="px-5 py-2.5 rounded-full bg-primary-container text-primary font-label text-xs font-bold uppercase tracking-wider">Deze maand</button>
</div>
</main>
<!-- Fixed Action Button at Bottom -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-surface via-surface to-transparent pt-12">
<button class="w-full bg-primary-container text-primary font-headline font-bold text-lg py-5 rounded-full shadow-[0_12px_30px_rgba(109,90,0,0.15)] active:scale-95 transition-all duration-200">
            Selectie bevestigen
        </button>
</div>
</body></html>
