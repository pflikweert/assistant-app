<!DOCTYPE html>

<html lang="nl"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-bright": "#f5f6f7",
              "tertiary-fixed": "#e3fd74",
              "on-primary-fixed": "#433700",
              "tertiary": "#536200",
              "surface-variant": "#dadddf",
              "primary-fixed": "#fdd404",
              "primary": "#6d5a00",
              "on-primary": "#fff2ce",
              "primary-dim": "#5f4e00",
              "on-tertiary-fixed-variant": "#5b6b00",
              "error": "#b02500",
              "primary-container": "#fdd404",
              "surface-tint": "#6d5a00",
              "inverse-surface": "#0c0f10",
              "surface": "#f5f6f7",
              "surface-container-lowest": "#ffffff",
              "on-surface": "#2c2f30",
              "on-surface-variant": "#595c5d",
              "error-dim": "#b92902",
              "secondary-dim": "#4a5153",
              "on-error-container": "#520c00",
              "surface-container-high": "#e0e3e4",
              "tertiary-container": "#e3fd74",
              "surface-container": "#e6e8ea",
              "surface-container-low": "#eff1f2",
              "on-primary-fixed-variant": "#645300",
              "on-secondary-container": "#4c5355",
              "secondary-fixed": "#dde4e6",
              "tertiary-dim": "#485500",
              "surface-container-highest": "#dadddf",
              "on-secondary-fixed-variant": "#565d5f",
              "inverse-on-surface": "#9b9d9e",
              "on-primary-container": "#594a00",
              "secondary-fixed-dim": "#cfd6d8",
              "on-background": "#2c2f30",
              "on-error": "#ffefec",
              "inverse-primary": "#fdd404",
              "outline": "#757778",
              "background": "#f5f6f7",
              "primary-fixed-dim": "#edc600",
              "tertiary-fixed-dim": "#d5ee68",
              "on-secondary-fixed": "#394043",
              "on-tertiary-container": "#516000",
              "surface-dim": "#d1d5d7",
              "on-secondary": "#edf4f6",
              "error-container": "#f95630",
              "on-tertiary-fixed": "#414d00",
              "secondary-container": "#dde4e6",
              "outline-variant": "#abadae",
              "secondary": "#565d5f",
              "on-tertiary": "#e5ff76"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        details > summary::-webkit-details-marker {
            display: none;
        }
        details[open] .expand-icon {
            transform: rotate(180deg);
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface overflow-hidden">
<!-- Full Screen Filter Overlay -->
<main class="fixed inset-0 bg-surface flex flex-col z-50">
<!-- Header: TopAppBar logic applied -->
<header class="flex items-center justify-between px-6 h-20 w-full bg-surface/80 backdrop-blur-xl shrink-0">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-highest transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface" data-icon="close">close</span>
</button>
<div class="flex-1 px-4">
<h1 class="font-headline font-extrabold text-2xl tracking-tight text-on-surface">Filters</h1>
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<!-- Scrollable Content Canvas -->
<div class="flex-1 overflow-y-auto px-6 pt-4 pb-32 hide-scrollbar">
<!-- Section 1: Periode -->
<section class="mb-10">
<h2 class="font-headline font-bold text-lg mb-4 px-1">Periode</h2>
<div class="grid grid-cols-2 gap-3"><!-- Deze maand (Active) -->
<button class="flex flex-col items-start p-4 bg-primary text-on-primary rounded-xl transition-all active:scale-95 text-left shadow-sm">
<span class="text-[10px] font-bold uppercase tracking-widest opacity-70 mb-0.5">Tijdlijn</span>
<span class="font-headline font-bold text-sm">Deze maand</span>
</button>
<!-- Vorige maand -->
<button class="flex flex-col items-start p-4 bg-surface-container-low hover:bg-surface-container-high text-on-surface rounded-xl transition-all active:scale-95 text-left">
<span class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant/60 mb-0.5">Tijdlijn</span>
<span class="font-headline font-bold text-sm">Vorige maand</span>
</button>
<!-- Dit jaar -->
<button class="flex flex-col items-start p-4 bg-surface-container-low hover:bg-surface-container-high text-on-surface rounded-xl transition-all active:scale-95 text-left">
<span class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant/60 mb-0.5">Tijdlijn</span>
<span class="font-headline font-bold text-sm">Dit jaar</span>
</button>
<!-- Aangepast -->
<button class="flex flex-col items-start p-4 bg-surface-container-low hover:bg-surface-container-high text-on-surface rounded-xl transition-all active:scale-95 text-left">
<div class="flex items-center justify-between w-full">
<span class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant/60 mb-0.5">Selectie</span>
<span class="material-symbols-outlined text-xs text-on-surface-variant">calendar_today</span>
</div>
<span class="font-headline font-bold text-sm">Aangepast</span>
</button></div>
</section>
<!-- Section 3: Type -->
<section class="mb-10">
<h2 class="font-headline font-bold text-lg mb-4 px-1">Type</h2>
<div class="flex p-1 bg-surface-container-low rounded-full w-full max-w-sm">
<button class="flex-1 py-3 px-4 rounded-full bg-surface-container-lowest shadow-sm font-bold text-sm text-on-surface transition-all">
                    Alle
                </button>
<button class="flex-1 py-3 px-4 rounded-full font-medium text-sm text-on-surface-variant hover:text-on-surface transition-all">
                    Inkomsten
                </button>
<button class="flex-1 py-3 px-4 rounded-full font-medium text-sm text-on-surface-variant hover:text-on-surface transition-all">
                    Uitgaven
                </button>
</div>
</section>
<!-- Section 2: Categorie (Updated with Hierarchy) -->
<section class="mb-10">
<h2 class="font-headline font-bold text-lg mb-4 px-1">Categorie</h2>
<div class="space-y-3">
<!-- Category 1: Boodschappen -->
<details class="group bg-surface-container-low rounded-lg overflow-hidden border border-transparent open:border-outline-variant/20 transition-all">
<summary class="flex items-center justify-between p-4 cursor-pointer list-none select-none px-6">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary p-2 bg-primary-container rounded-full" data-icon="shopping_basket">shopping_basket</span>
<span class="font-bold">Boodschappen</span>
</div>
<div class="flex items-center gap-3">
<div class="w-6 h-6 rounded-md border-2 border-outline-variant flex items-center justify-center bg-surface-container-lowest"></div>
<span class="material-symbols-outlined text-on-surface-variant expand-icon transition-transform duration-300">expand_more</span>
</div>
</summary>
<div class="pb-4">
<label class="flex items-center justify-between p-3 bg-surface-container-lowest/50 hover:bg-surface-container-lowest transition-colors cursor-pointer px-6 border-t border-surface-variant/30">
<span class="text-sm font-medium">Supermarkt</span>
<div class="w-5 h-5 rounded border-2 border-outline-variant"></div>
</label>
<label class="flex items-center justify-between p-3 bg-surface-container-lowest/50 hover:bg-surface-container-lowest transition-colors cursor-pointer px-6 border-t border-surface-variant/30">
<span class="text-sm font-medium">Speciaalzaak</span>
<div class="w-5 h-5 rounded border-2 border-outline-variant"></div>
</label>
</div>
</details>
<!-- Category 2: Vaste lasten (Active/Selected) -->
<details class="group bg-surface-container-low rounded-lg overflow-hidden border border-transparent open:border-outline-variant/20 transition-all" open="">
<summary class="flex items-center justify-between p-4 cursor-pointer list-none select-none px-6">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary p-2 bg-primary-container rounded-full" data-icon="house">house</span>
<span class="font-bold">Vaste lasten</span>
</div>
<div class="flex items-center gap-3">
<div class="w-6 h-6 rounded-md bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-sm" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant expand-icon transition-transform duration-300">expand_more</span>
</div>
</summary>
<div class="pb-4">
<label class="flex items-center justify-between p-3 bg-surface-container-lowest/50 hover:bg-surface-container-lowest transition-colors cursor-pointer px-6 border-t border-surface-variant/30">
<span class="text-sm font-medium">Huur / Hypotheek</span>
<div class="w-5 h-5 rounded bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[14px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</label>
<label class="flex items-center justify-between p-3 bg-surface-container-lowest/50 hover:bg-surface-container-lowest transition-colors cursor-pointer px-6 border-t border-surface-variant/30">
<span class="text-sm font-medium">Energie</span>
<div class="w-5 h-5 rounded border-2 border-outline-variant"></div>
</label>
<label class="flex items-center justify-between p-3 bg-surface-container-lowest/50 hover:bg-surface-container-lowest transition-colors cursor-pointer px-6 border-t border-surface-variant/30">
<span class="text-sm font-medium">Verzekeringen</span>
<div class="w-5 h-5 rounded border-2 border-outline-variant"></div>
</label>
</div>
</details>
<!-- Category 3: Vrije tijd -->
<details class="group bg-surface-container-low rounded-lg overflow-hidden border border-transparent open:border-outline-variant/20 transition-all">
<summary class="flex items-center justify-between p-4 cursor-pointer list-none select-none px-6">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary p-2 bg-primary-container rounded-full" data-icon="theater_comedy">theater_comedy</span>
<span class="font-bold">Vrije tijd</span>
</div>
<div class="flex items-center gap-3">
<div class="w-6 h-6 rounded-md border-2 border-outline-variant flex items-center justify-center bg-surface-container-lowest"></div>
<span class="material-symbols-outlined text-on-surface-variant expand-icon transition-transform duration-300">expand_more</span>
</div>
</summary>
<div class="pb-4">
<label class="flex items-center justify-between p-3 bg-surface-container-lowest/50 hover:bg-surface-container-lowest transition-colors cursor-pointer px-6 border-t border-surface-variant/30">
<span class="text-sm font-medium">Uitgaan</span>
<div class="w-5 h-5 rounded border-2 border-outline-variant"></div>
</label>
<label class="flex items-center justify-between p-3 bg-surface-container-lowest/50 hover:bg-surface-container-lowest transition-colors cursor-pointer px-6 border-t border-surface-variant/30">
<span class="text-sm font-medium">Sport</span>
<div class="w-5 h-5 rounded border-2 border-outline-variant"></div>
</label>
</div>
</details>
<!-- Category 4: Salaris -->
<details class="group bg-surface-container-low rounded-lg overflow-hidden border border-transparent open:border-outline-variant/20 transition-all">
<summary class="flex items-center justify-between p-4 cursor-pointer list-none select-none px-6">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary p-2 bg-primary-container rounded-full" data-icon="payments">payments</span>
<span class="font-bold">Salaris</span>
</div>
<div class="flex items-center gap-3">
<div class="w-6 h-6 rounded-md border-2 border-outline-variant flex items-center justify-center bg-surface-container-lowest"></div>
<span class="material-symbols-outlined text-on-surface-variant expand-icon transition-transform duration-300">expand_more</span>
</div>
</summary>
<div class="pb-4">
<label class="flex items-center justify-between p-3 bg-surface-container-lowest/50 hover:bg-surface-container-lowest transition-colors cursor-pointer px-6 border-t border-surface-variant/30">
<span class="text-sm font-medium">Hoofdbaan</span>
<div class="w-5 h-5 rounded border-2 border-outline-variant"></div>
</label>
<label class="flex items-center justify-between p-3 bg-surface-container-lowest/50 hover:bg-surface-container-lowest transition-colors cursor-pointer px-6 border-t border-surface-variant/30">
<span class="text-sm font-medium">Bijbaan / Freelance</span>
<div class="w-5 h-5 rounded border-2 border-outline-variant"></div>
</label>
</div>
</details>
</div>
</section>
<!-- Section 4: Bedrag -->
<section class="mb-10">
<div class="flex justify-between items-end mb-6 px-1">
<h2 class="font-headline font-bold text-lg">Bedrag</h2>
<span class="text-on-surface-variant font-label text-sm">€ 0 — € 2.500+</span>
</div>
<div class="space-y-8 px-2">
<div class="relative h-2 w-full bg-surface-container-highest rounded-full">
<div class="absolute h-full w-2/3 left-0 bg-primary rounded-full"></div>
<div class="absolute top-1/2 left-0 -translate-y-1/2 -translate-x-1/2 w-6 h-6 rounded-full bg-surface-container-lowest shadow-lg border-2 border-primary"></div>
<div class="absolute top-1/2 left-2/3 -translate-y-1/2 -translate-x-1/2 w-6 h-6 rounded-full bg-surface-container-lowest shadow-lg border-2 border-primary"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider ml-1">Van</label>
<div class="bg-surface-container-low p-4 rounded-md flex items-center">
<span class="mr-2 text-on-surface-variant font-medium">€</span>
<input class="bg-transparent border-none focus:ring-0 p-0 w-full font-bold text-on-surface" type="number" value="0"/>
</div>
</div>
<div class="space-y-2">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider ml-1">Tot</label>
<div class="bg-surface-container-low p-4 rounded-md flex items-center">
<span class="mr-2 text-on-surface-variant font-medium">€</span>
<input class="bg-transparent border-none focus:ring-0 p-0 w-full font-bold text-on-surface" type="number" value="2500"/>
</div>
</div>
</div>
</div>
</section>
</div>
<!-- Bottom Bar: Transactional footer -->
<footer class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-2xl px-6 pt-4 pb-8 flex items-center gap-4">
<button class="flex-1 py-4 text-on-surface-variant font-bold text-sm hover:bg-surface-container-high rounded-full transition-colors active:scale-95">
            Filters wissen
        </button>
<button class="flex-[2] py-4 bg-primary-container text-on-primary-container font-extrabold text-sm rounded-full shadow-sm hover:opacity-90 transition-opacity active:scale-95 flex items-center justify-center gap-2">
<span>Toepassen</span>
<span class="material-symbols-outlined text-lg" data-icon="chevron_right">chevron_right</span>
</button>
</footer>
</main>
<!-- Visual Background Element (Misty Backdrop) -->
<div class="fixed inset-0 pointer-events-none -z-10">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-5%] right-[-5%] w-[30%] h-[30%] bg-tertiary-container/10 rounded-full blur-[100px]"></div>
</div>
</body></html>
