<!DOCTYPE html>

<html lang="nl"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-dim": "#d1d5d7",
              "on-secondary-fixed": "#394043",
              "on-tertiary": "#e5ff76",
              "inverse-primary": "#fdd404",
              "background": "#f5f6f7",
              "tertiary": "#536200",
              "on-secondary-fixed-variant": "#565d5f",
              "surface-container-highest": "#dadddf",
              "tertiary-fixed": "#e3fd74",
              "on-primary-fixed": "#433700",
              "outline-variant": "#abadae",
              "on-error-container": "#520c00",
              "surface-bright": "#f5f6f7",
              "on-surface": "#2c2f30",
              "surface": "#f5f6f7",
              "surface-container-lowest": "#ffffff",
              "tertiary-container": "#e3fd74",
              "inverse-on-surface": "#9b9d9e",
              "on-secondary-container": "#4c5355",
              "tertiary-dim": "#485500",
              "secondary-dim": "#4a5153",
              "inverse-surface": "#0c0f10",
              "surface-container-high": "#e0e3e4",
              "on-tertiary-fixed": "#414d00",
              "surface-container": "#e6e8ea",
              "on-primary-fixed-variant": "#645300",
              "primary-fixed": "#fdd404",
              "on-primary-container": "#594a00",
              "secondary-fixed": "#dde4e6",
              "secondary-container": "#dde4e6",
              "surface-tint": "#6d5a00",
              "on-tertiary-container": "#516000",
              "on-secondary": "#edf4f6",
              "primary-container": "#fdd404",
              "outline": "#757778",
              "tertiary-fixed-dim": "#d5ee68",
              "on-primary": "#fff2ce",
              "on-tertiary-fixed-variant": "#5b6b00",
              "on-background": "#2c2f30",
              "primary-dim": "#5f4e00",
              "primary": "#6d5a00",
              "surface-variant": "#dadddf",
              "error": "#b02500",
              "secondary": "#565d5f",
              "on-error": "#ffefec",
              "surface-container-low": "#eff1f2",
              "on-surface-variant": "#595c5d",
              "error-dim": "#b92902",
              "error-container": "#f95630",
              "secondary-fixed-dim": "#cfd6d8",
              "primary-fixed-dim": "#edc600"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .font-plus-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- Header / Brand Anchor -->
<header class="fixed top-0 w-full z-50 bg-slate-50/80 dark:bg-slate-950/80 backdrop-blur-xl flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-yellow-600 dark:text-yellow-400" data-icon="account_balance">account_balance</span>
<span class="font-plus-jakarta text-2xl font-bold tracking-tight text-on-surface">Mijn Financiën</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center px-8 pt-24 pb-12 max-w-md mx-auto w-full">
<!-- Hero Section: Swiss Zen Style -->
<section class="mb-12">
<h1 class="font-plus-jakarta text-5xl font-extrabold tracking-tight text-inverse-surface leading-tight mb-4">
                Welkom terug
            </h1>
<p class="text-on-surface-variant text-lg font-medium max-w-[280px]">
                Log in om je financiën te beheren
            </p>
</section>
<!-- Login Form -->
<form class="space-y-8" onsubmit="return false;">
<div class="space-y-6">
<!-- Input Group 1 -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant ml-1 font-label" for="email">E-mailadres</label>
<input class="w-full h-14 px-6 bg-surface-container-low border-none rounded-full text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-300 outline-none" id="email" placeholder="naam@voorbeeld.nl" type="email"/>
</div>
<!-- Input Group 2 -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-sm font-bold text-on-surface-variant font-label" for="password">Wachtwoord</label>
<a class="text-sm font-bold text-primary hover:opacity-70 transition-opacity" href="#">Wachtwoord vergeten?</a>
</div>
<input class="w-full h-14 px-6 bg-surface-container-low border-none rounded-full text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-300 outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-[#FFD700] text-[#2c2f30] font-bold rounded-full shadow-lg shadow-[#FFD700]/20 active:scale-95 transition-all flex items-center justify-center gap-2 group hover:opacity-90">
<span>Inloggen</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Biometric Login Option -->
<div class="pt-2">
<button class="w-full h-14 flex items-center justify-center gap-3 text-on-surface font-semibold hover:bg-surface-container-high rounded-full transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="fingerprint">fingerprint</span>
<span>Biometrisch inloggen</span>
</button>
</div>
</form>
<!-- Footer Area -->
<footer class="mt-auto pt-16 text-center">
<p class="text-on-surface-variant font-medium">
                Nog geen account? 
                <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4 ml-1" href="#">Registreet hier</a>
</p>
</footer>
</main>
<!-- Decorative Background Element (Tactile Premium) -->
<div class="fixed top-0 right-0 -z-10 w-full h-full overflow-hidden pointer-events-none opacity-40">
<div class="absolute top-[-10%] right-[-10%] w-[60%] h-[50%] bg-primary-container rounded-full blur-[120px] opacity-20"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[40%] h-[40%] bg-surface-container-highest rounded-full blur-[80px]"></div>
</div>
<!-- No Navigation Shell (As per Suppresion Rules for Login/Focused Transactional screens) -->
</body></html>
